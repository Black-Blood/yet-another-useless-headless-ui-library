name: status-bot

on:
  create:
  delete:
  pull_request_target:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only plan and report; write nothing
        type: boolean
        default: false
      force:
        description: Ignore the change limit (maxChangesPerRun)
        type: boolean
        default: false

concurrency:
  group: status-bot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the bot's own code from the default branch — never the PR head (pull_request_target).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/status-bot/package-lock.json
      - name: Install
        working-directory: automation/status-bot
        run: npm ci
      - name: Reconcile statuses
        working-directory: automation/status-bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          FORCE: ${{ inputs.force || false }}
        run: npm start

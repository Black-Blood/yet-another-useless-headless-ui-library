name: status-bot CI

on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/status-bot*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/status-bot
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8 # bundles TypeScript 6.0.3
      - run: deno task check
      - run: deno lint
      - run: deno task test

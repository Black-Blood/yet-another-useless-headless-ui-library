name: status-bot CI

on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/status-bot*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/status-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/status-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
